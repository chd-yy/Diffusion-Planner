_target_: nuplan.planning.scenario_builder.scenario_filter.ScenarioFilter
_convert_: "all"

# 从 NuPlan mini-val 的 10 个官方 validation log 中选取 100 个有效目标场景。
# B Epoch 10 和 RL 必须共用这个 filter，保证配对比较。
scenario_types:
  - starting_left_turn
  - starting_right_turn
  - starting_straight_traffic_light_intersection_traversal
  - stopping_with_lead
  - high_lateral_acceleration
  - high_magnitude_speed
  - low_magnitude_speed
  - traversing_pickup_dropoff
  - waiting_for_pedestrian_to_cross
  - behind_long_vehicle
  - stationary_in_traffic
  - near_multiple_vehicles
  - changing_lane
  - following_lane_with_lead

scenario_tokens: null
log_names:
  - "2021.06.07.12.54.00_veh-35_01843_02314"
  - "2021.06.07.18.53.26_veh-26_00005_00427"
  - "2021.06.08.12.54.54_veh-26_04262_04732"
  - "2021.06.08.14.35.24_veh-26_02555_03004"
  - "2021.06.08.16.31.33_veh-38_01589_02072"
  - "2021.07.24.20.37.45_veh-17_00015_00375"
  - "2021.07.24.23.50.16_veh-17_01696_02071"
  - "2021.08.09.17.55.59_veh-28_00021_00307"
  - "2021.08.24.13.12.55_veh-45_00386_00472"
  - "2021.10.05.07.10.04_veh-52_01442_01802"
map_names: null

num_scenarios_per_type: null
limit_total_scenarios: 100
timestamp_threshold_s: 15
ego_displacement_minimum_m: null
ego_start_speed_threshold: null
ego_stop_speed_threshold: null
speed_noise_tolerance: null

expand_scenarios: false
remove_invalid_goals: true
shuffle: false
